<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../src/input.css" />
  </head>
  <body>
    <div
      id="app"
      class="max-w-xl mx-auto px-3 sm:px-6 md:px-8 py-6 space-y-4 sm:space-y-6 w-full flex-grow preload-hidden"
    >
      <header></header>

      <main
        class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 sm:p-6 shadow-xl space-y-5"
      >
        <!-- クエスト難易度 -->
        <div class="space-y-1.5">
          <label
            for="select-difficulty"
            class="block text-sm font-medium text-slate-300"
            >クエスト難易度</label
          >
          <select
            id="select-difficulty"
            v-model.number="selectedDifficulty"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in difficultyOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- クリアランク -->
        <div class="space-y-1.5">
          <label
            for="select-rank"
            class="block text-sm font-medium text-slate-300"
            >クリアランク</label
          >
          <select
            id="select-rank"
            v-model.number="selectedRank"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in rankOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- 合計レアリティ -->
        <div class="space-y-1.5">
          <label
            for="select-rarity"
            class="block text-sm font-medium text-slate-300"
            >合計レアリティ</label
          >
          <select
            id="select-rarity"
            v-model.number="selectedRarity"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in rarityOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- マルチ人数 -->
        <div class="space-y-1.5">
          <label
            for="select-multi"
            class="block text-sm font-medium text-slate-300"
            >マルチ人数</label
          >
          <select
            id="select-multi"
            v-model.number="selectedMulti"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in multiOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- イベント倍率 -->
        <div class="space-y-1.5">
          <label
            for="select-event"
            class="block text-sm font-medium text-slate-300"
            >イベント</label
          >
          <select
            id="select-event"
            v-model.number="selectedEvent"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in eventOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- わくわくの実 -->
        <div class="space-y-1.5">
          <label
            for="select-wakuwaku"
            class="block text-sm font-medium text-slate-300"
            >わくわくの実</label
          >
          <select
            id="select-wakuwaku"
            v-model.number="selectedWakuwaku"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in wakuwakuOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- モンスポット -->
        <div class="space-y-1.5">
          <label
            for="select-spot"
            class="block text-sm font-medium text-slate-300"
            >モンスポット</label
          >
          <select
            id="select-spot"
            v-model.number="selectedSpot"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in spotOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- メダルアップモンスター -->
        <div class="space-y-1.5">
          <label
            for="select-medal-up-monster"
            class="block text-sm font-medium text-slate-300"
            >メダルアップモンスター</label
          >
          <select
            id="select-medal-up-monster"
            v-model.number="selectedMedalUpMonster"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100"
          >
            <option
              v-for="item in medalUpMonsterOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- 結果表示エリア -->
        <section
          class="bg-amber-950/40 border border-amber-500/40 p-4 sm:p-6 rounded-xl space-y-4 mt-6"
        >
          <h2 class="text-xl font-bold text-amber-300 text-center">計算結果</h2>
          <div class="grid grid-cols-2 gap-3">
            <div
              class="bg-slate-800/80 p-3 sm:p-4 rounded-lg border border-slate-700 text-center space-y-1 overflow-hidden"
            >
              <p class="text-xs text-slate-400">ストーン</p>
              <p
                class="text-lg sm:text-xl md:text-2xl font-bold text-amber-300 font-mono break-all"
              >
                {{ calculatedStones.toLocaleString() }}
                <span class="text-xs sm:text-sm font-sans">個</span>
              </p>
            </div>

            <div
              class="bg-slate-800/80 p-3 sm:p-4 rounded-lg border border-slate-700 text-center space-y-1 overflow-hidden"
            >
              <p class="text-xs text-slate-400">メダル</p>
              <p
                class="text-lg sm:text-xl md:text-2xl font-bold text-amber-300 font-mono break-all"
              >
                {{ calculatedRemainderMedals.toLocaleString() }}
                <span class="text-xs sm:text-sm font-sans">枚</span>
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <footer class="mt-auto"></footer>
    <script type="module" src="../src/common.ts"></script>
    <script type="module" src="../src/components/tool-header.ts"></script>
    <script type="module" src="./ts/app.ts"></script>
  </body>
</html>
