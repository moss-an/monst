<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>モンスト スコア計算</title>
    <meta
      name="description"
      content="モンスターストライクにおける獲得メダル数シミュレーターです。クエスト1周あたりのマジックストーン数・メダル数を簡単に計算できます。"
    />
    <meta property="og:title" content="モンスト スコア計算" />
    <meta
      property="og:description"
      content="モンスターストライクにおける獲得メダル数シミュレーターです。クエスト1周あたりのマジックストーン数・メダル数を簡単に計算できます。"
    />
    <meta
      property="og:image"
      content="https://moss-an.github.io/monst/ogp.png"
    />
    <meta
      property="og:url"
      content="https://moss-an.github.io/monst/score-calc/"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="../src/input.css" />
    <script type="module" src="../src/components/favicon.ts"></script>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans"
  >
    <div
      id="app"
      class="max-w-xl mx-auto px-3 sm:px-6 md:px-8 py-6 space-y-4 sm:space-y-6 w-full flex-grow"
    >
      <header class="text-center pl-11 pr-2 sm:px-0">
        <h1
          class="whitespace-nowrap text-2xl sm:text-3xl font-bold text-amber-400"
        >
          モンスト スコア計算
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          獲得メダル数シミュレーター
        </p>
      </header>

      <main
        class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 sm:p-6 shadow-xl space-y-5"
      >
        <!-- クエスト難易度 -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >クエスト難易度</label
          >
          <select
            v-model.number="selectedDifficulty"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in difficultyOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- クリアランク -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >クリアランク</label
          >
          <select
            v-model.number="selectedRank"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in rankOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- 合計レアリティ -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >合計レアリティ</label
          >
          <select
            v-model.number="selectedRarity"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in rarityOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- マルチ人数 -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >マルチ人数</label
          >
          <select
            v-model.number="selectedMulti"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in multiOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- イベント倍率 -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >イベント</label
          >
          <select
            v-model.number="selectedEvent"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in eventOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- スコア稼ぎの実 -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >スコア稼ぎの実</label
          >
          <select
            v-model.number="selectedWakuwaku"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in wakuwakuOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- モンスポット -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >モンスポット</label
          >
          <select
            v-model.number="selectedMonspot"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in monspotOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- メダルアップモンスター -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-300"
            >メダルアップモンスター</label
          >
          <select
            v-model.number="selectedMedalUp"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option
              v-for="item in medalUpOptions"
              :key="item.value"
              :value="item.value"
            >
              {{ item.label }}
            </option>
          </select>
        </div>

        <!-- 結果表示エリア -->
        <div class="mt-6 grid grid-cols-2 gap-3">
          <!-- ストーン -->
          <div
            class="p-4 bg-amber-950/40 border border-amber-500/30 rounded-xl text-center space-y-1"
          >
            <span class="text-sm font-medium text-amber-300">ストーン</span>
            <div class="text-2xl sm:text-3xl font-extrabold text-amber-400">
              {{ calculatedStones.toLocaleString() }}
              <span class="text-base font-bold">個</span>
            </div>
          </div>

          <!-- メダル -->
          <div
            class="p-4 bg-amber-950/40 border border-amber-500/30 rounded-xl text-center space-y-1"
          >
            <span class="text-sm font-medium text-amber-300">メダル</span>
            <div class="text-2xl sm:text-3xl font-extrabold text-amber-400">
              {{ calculatedRemainderMedals.toLocaleString() }}
              <span class="text-base font-bold">枚</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer
      class="py-6 text-center text-slate-400 text-xs border-t border-slate-800/80 mt-auto"
    >
      <p>
        <a
          href="https://github.com/moss-an/monst/issues/new?title=%E3%80%90score-calc%E3%80%91"
          target="_blank"
          rel="noopener noreferrer"
          class="text-slate-400 hover:text-slate-200 hover:underline transition inline-flex items-center gap-1"
        >
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
            />
          </svg>
          改善要望・不具合報告はこちら（GitHub Issue）
        </a>
      </p>
    </footer>
    <script type="module" src="../src/components/hamburger.ts"></script>
    <script type="module" src="../src/components/footer.ts"></script>
    <script type="module" src="./ts/app.ts"></script>
  </body>
</html>
